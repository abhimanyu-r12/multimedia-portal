<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .theater-main-stage.theater-wide {
      grid-column: 1 / -1;
      border-color: #ea4335;
    }
  </style>
</head>
<body>

  <!-- Navigation Header -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">M</div>
        <span>MediaSphere</span>
      </a>

      <button class="mobile-toggle" aria-label="Toggle menu">☰</button>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="images.html" class="nav-link">Images</a></li>
        <li><a href="audio.html" class="nav-link">Audio</a></li>
        <li><a href="video.html" class="nav-link active">Video</a></li>
      </ul>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div class="container">
      <section class="page-hero">
        <h1 class="page-title"><span class="gradient-text">Video</span></h1>
      </section>

      <!-- Video Stage Section -->
      <section class="theater-container">
        <div class="theater-main-stage">
          
          <!-- 16:9 Video Canvas -->
          <div class="video-container">
            <div class="video-element-placeholder">
              <button class="video-play-huge-btn" type="button" aria-label="Play">▶</button>
              <h3 style="font-family: var(--font-heading); color: #fff;">Video Player Placeholder</h3>
            </div>
          </div>

          <!-- Video Control Bar -->
          <div class="video-meta-bar">
            <div class="video-headline">
              <h2 id="mainVideoTitle">Video 1</h2>
            </div>

            <div class="video-actions">
              <button class="btn-pill" id="btnTheaterMode" type="button">⊞ Theater Mode</button>
              <button class="btn-pill" id="btnPlaybackSpeed" type="button">⚡ 1x</button>
            </div>
          </div>
        </div>

        <!-- Video Queue Grid -->
        <div>
          <h3 class="video-section-title">Videos</h3>

          <div class="video-grid">
            <article class="video-card">
              <div class="video-thumb-box">
                <svg class="icon-placeholder" style="width: 40px; height: 40px;" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
                <span class="video-duration-badge">00:40</span>
              </div>
              <div class="video-card-body">
                <h4 class="video-card-title">Video 1</h4>
              </div>
            </article>

            <article class="video-card">
              <div class="video-thumb-box">
                <svg class="icon-placeholder" style="width: 40px; height: 40px;" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
                <span class="video-duration-badge">00:22</span>
              </div>
              <div class="video-card-body">
                <h4 class="video-card-title">Video 2</h4>
              </div>
            </article>

            <article class="video-card">
              <div class="video-thumb-box">
                <svg class="icon-placeholder" style="width: 40px; height: 40px;" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
                <span class="video-duration-badge">00:33</span>
              </div>
              <div class="video-card-body">
                <h4 class="video-card-title">Video 3</h4>
              </div>
            </article>
          </div>
        </div>

      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-content">
      <div class="footer-brand">
        <strong>MediaSphere</strong>
      </div>
      <ul class="footer-nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="images.html">Images</a></li>
        <li><a href="audio.html">Audio</a></li>
        <li><a href="video.html">Video</a></li>
      </ul>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
